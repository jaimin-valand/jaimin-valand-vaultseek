[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "private-search-engine"
version = "3.0.0"
description = "A from-scratch local-first private search engine with crawling, BM25 retrieval, distributed search, replication, consensus, observability and production-oriented APIs."
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["search-engine", "information-retrieval", "bm25", "distributed-systems", "python", "private-search"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.urls]
Homepage = "https://github.com/jaimin-valand/jaimin-valand-vaultseek"
Repository = "https://github.com/jaimin-valand/jaimin-valand-vaultseek"
Issues = "https://github.com/jaimin-valand/jaimin-valand-vaultseek/issues"

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["private_search_engine*"]

[tool.pytest.ini_options]
testpaths = ["private_search_engine/tests"]
